stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn
  log_format: json

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "[::]:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

overrides:
  defaults:
    compaction:
      block_retention: 72h

usage_report:
  reporting_enabled: false
